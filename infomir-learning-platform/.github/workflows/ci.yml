name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: infomir_test
          POSTGRES_USER: infomir
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infomir -d infomir_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Validate PostgreSQL migrations
        env:
          DATABASE_URL: postgresql+psycopg://infomir:test-password@127.0.0.1:5432/infomir_test
          APP_ENV: testing
          SECRET_KEY: ci-only-secret-key-not-for-production
        run: alembic -c backend/alembic.ini upgrade head
      - run: python -m compileall -q backend
      - run: pytest -q


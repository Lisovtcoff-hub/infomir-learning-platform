<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Админка Infomir</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    .admin-page-main{padding-top:20px}
    .admin-shell{max-width:1320px;margin:0 auto;padding:0 16px 28px}
    .admin-topbar{
      position:sticky;
      top:0;
      z-index:70;
      border-bottom:1px solid var(--line);
      background:var(--surface-glass);
      backdrop-filter:blur(10px);
    }
    .admin-topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:72px}
    .admin-nav{display:flex;align-items:center;gap:24px}
    .admin-menu{display:flex;align-items:center;gap:18px;list-style:none;margin:0;padding:0}
    .admin-menu li{position:relative;display:flex;align-items:center}
    .admin-menu a,.admin-menu button{
      border:0;background:transparent;color:var(--text);font:inherit;font-weight:600;
      cursor:pointer;padding:8px 2px;border-bottom:2px solid transparent
    }
    .admin-menu a:hover,.admin-menu button:hover,.admin-menu a.active,.admin-menu button.active{
      color:var(--primary);border-bottom-color:var(--primary)
    }
    .admin-menu .dropdown-toggle{color:var(--muted);width:22px;height:22px;padding:0}
    .admin-menu .dropdown{
      display:none;position:absolute;top:42px;left:0;min-width:190px;list-style:none;margin:0;padding:8px;
      border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface);box-shadow:var(--shadow-soft)
    }
    .admin-menu .dropdown a,.admin-menu .dropdown button{
      display:block;width:100%;text-align:left;border-radius:10px;padding:9px 12px;border-bottom:0
    }
    .admin-menu .dropdown a:hover,.admin-menu .dropdown a.active,
    .admin-menu .dropdown button:hover,.admin-menu .dropdown button.active{
      background:var(--surface-2);border-bottom:0
    }
    .admin-menu .has-dropdown:hover .dropdown,.admin-menu .has-dropdown.open .dropdown{display:block}
    .admin-view{display:none}
    .admin-view.active{display:block}
    .admin-hero-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
    .admin-hero-card{
      border:1px solid var(--line);
      border-radius:16px;
      background:var(--surface);
      padding:16px;
      box-shadow:var(--shadow-soft);
      display:grid;
      gap:10px;
    }
    .admin-hero-card h3{margin:0;font-size:1.05rem}
    .admin-hero-card p{margin:0;color:var(--muted)}
    .admin-hero-stats{display:grid;gap:6px;font-size:.92rem}
    .admin-hero-actions{display:flex;gap:8px;flex-wrap:wrap}
    .admin-card{background:#fff;border:1px solid #e6e6e6;border-radius:14px;padding:14px}
    .admin-grid{display:grid;grid-template-columns:1.05fr 1.2fr;gap:14px}
    .admin-list{max-height:430px;overflow:auto;border:1px solid #ececec;border-radius:10px;padding:8px}
    .admin-list button{display:block;width:100%;text-align:left;margin:4px 0}
    .admin-form{display:grid;gap:8px}
    .admin-actions{display:flex;gap:8px;flex-wrap:wrap}
    .admin-table{width:100%;border-collapse:collapse}
    .admin-table th,.admin-table td{border-bottom:1px solid #efefef;padding:9px;text-align:left}
    .admin-card{overflow:auto}
    @media (max-width:980px){.admin-grid{grid-template-columns:1fr}.admin-hero-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media (max-width:900px){
      .admin-topbar-inner{align-items:flex-start;flex-direction:column;padding:10px 0}
      .admin-nav{width:100%;align-items:stretch;flex-direction:column;gap:12px}
      .admin-menu{flex-wrap:wrap;gap:10px}
      .admin-menu .has-dropdown:hover .dropdown{display:none}
      .admin-menu .has-dropdown.open .dropdown{
        display:block;position:static;width:100%;margin-top:8px
      }
      .admin-hero-grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <header class="admin-topbar">
    <div class="container admin-topbar-inner">
      <a class="brand" href="/dashboard" aria-label="В админку">
        <span class="brand-logo"><img src="/static/images/logo.svg" alt="Логотип Infomir" /></span>
        <span id="adminBrand">Админка Infomir</span>
      </a>
      <nav class="admin-nav">
        <ul class="admin-menu" id="topMenu"></ul>
        <button id="logoutBtn" class="btn btn-ghost">Выйти</button>
      </nav>
    </div>
  </header>

  <main class="page-main admin-page-main">
  <div class="admin-shell">
    <section id="view-home" class="admin-view active">
      <div class="hero-block compact-hero">
        <h1 class="hero-title" style="font-size:clamp(1.5rem,2.6vw,2.2rem)">Панель управления</h1>
        <p class="hero-text">Быстрый доступ ко всем разделам админки и краткая статистика по контенту.</p>
      </div>
      <div class="admin-hero-grid" id="adminHomeCards" style="margin-top:14px"></div>
    </section>

    <section id="view-theory" class="admin-view">
      <div class="admin-card">
        <h2 id="theoryTitle"></h2>
        <div class="admin-actions" id="theorySubmenu"></div>
        <div class="admin-actions" id="theorySubjectSubmenu" style="margin-top:8px"></div>
      </div>
      <div class="admin-grid" style="margin-top:12px">
        <article class="admin-card"><div id="articleList" class="admin-list"></div></article>
        <article class="admin-card">
          <form id="articleForm" class="admin-form">
            <input type="hidden" name="id" />
            <input name="category_id" placeholder="ID category" />
            <input name="grade" placeholder="Класс: 7, 8 или 9" />
            <input name="subject" placeholder="Предмет" value="informatics" />
            <input name="slug" placeholder="slug" required />
            <input name="title" placeholder="title" required />
            <input name="sort_order" placeholder="sort order" value="0" />
            <textarea name="content" placeholder="Текст статьи"></textarea>
            <textarea name="content_json" placeholder="Блоки статьи в JSON (если заполнено, имеет приоритет)"></textarea>
            <div class="admin-actions"><button type="button" id="articleNew" class="btn btn-ghost"></button><button type="submit" class="btn btn-primary" id="articleSave"></button><button type="button" id="articleDelete" class="btn btn-ghost"></button></div>
          </form>
        </article>
      </div>
    </section>

    <section id="view-tasks" class="admin-view">
      <div class="admin-card"><h2 id="tasksTitle"></h2><div class="admin-actions" id="tasksSubmenu"></div></div>
      <div class="admin-card" style="margin-top:10px"><div class="admin-actions" id="tasksSubjectSubmenu"></div></div>
      <div class="admin-grid" style="margin-top:12px">
        <article class="admin-card"><div id="testList" class="admin-list"></div></article>
        <article class="admin-card">
          <form id="testForm" class="admin-form">
            <input type="hidden" name="id" />
            <input name="category_id" placeholder="ID category" />
            <input name="grade" placeholder="grade" />
            <input name="exam_type" placeholder="exam type" />
            <input name="subject" placeholder="subject (informatics/math/physics)" value="informatics" />
            <input name="title" placeholder="title" required />
            <textarea name="question" placeholder="question" required></textarea>
            <textarea name="answer" placeholder="answer" required></textarea>
            <textarea name="hint" placeholder="Подсказка"></textarea>
            <textarea name="explanation" placeholder="explanation"></textarea>
            <input name="difficulty" placeholder="difficulty" />
            <input name="source" placeholder="source" />
            <div class="admin-actions"><button type="button" id="testNew" class="btn btn-ghost"></button><button type="submit" class="btn btn-primary" id="testSave"></button><button type="button" id="testDelete" class="btn btn-ghost"></button></div>
          </form>
        </article>
      </div>
    </section>

    <section id="view-variants" class="admin-view">
      <div class="admin-card"><h2 id="variantsTitle"></h2><div class="admin-actions" id="variantsSubjectSubmenu"></div></div>
      <div class="admin-grid" style="margin-top:12px">
        <article class="admin-card"><div id="variantList" class="admin-list"></div></article>
        <article class="admin-card">
          <form id="variantForm" class="admin-form">
            <input type="hidden" name="id" />
            <input name="title" placeholder="title" required />
            <input name="exam_type" placeholder="exam type" required />
            <input name="subject" placeholder="subject (informatics/math/physics)" value="informatics" />
            <input name="grade" placeholder="grade" />
            <input name="time_limit_minutes" placeholder="time limit" />
            <textarea name="description" placeholder="description"></textarea>
            <input name="task_ids" placeholder="ID заданий через запятую, например 1, 2, 3" />
            <div class="admin-actions"><button type="button" id="variantNew" class="btn btn-ghost"></button><button type="submit" class="btn btn-primary" id="variantSave"></button><button type="button" id="variantDelete" class="btn btn-ghost"></button></div>
          </form>
        </article>
      </div>
    </section>

    <section id="view-students" class="admin-view"><div class="admin-card"><h2 id="studentsTitle"></h2><div id="studentsTable"></div></div></section>
    <section id="view-teachers" class="admin-view"><div class="admin-card"><h2 id="teachersTitle"></h2><div id="teachersTable"></div></div></section>
    <section id="view-admins" class="admin-view"><div class="admin-card"><h2 id="adminsTitle"></h2><div id="adminsTable"></div></div></section>
    <section id="view-tariffs" class="admin-view"><div class="admin-card"><h2 id="tariffsTitle"></h2><div id="tariffsTable"></div></div></section>
    <section id="view-payments" class="admin-view"><div class="admin-card"><h2 id="paymentsTitle"></h2><div id="paymentsTable"></div></div></section>
    <section id="view-withdrawals" class="admin-view"><div class="admin-card"><h2 id="withdrawalsTitle"></h2><div id="withdrawalsTable"></div></div></section>
    <section id="view-settings" class="admin-view"><div class="admin-card"><h2 id="settingsTitle"></h2><div id="settingsBox"></div></div></section>

    <p id="adminMsg"></p>
  </div>
  </main>
  <script src="/static/js/admin/app.js"></script>
</body>
</html>
